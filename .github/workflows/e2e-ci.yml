name: E2E Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-test:
    name: Build & Run E2E Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Run E2E Integration Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-e2e.sh

      - name: Upload Server E2E Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-e2e-logs
          path: server-e2e.log
          retention-days: 7
