apiVersion: v1
kind: ConfigMap
metadata:
  name: catalyst-config
data:
  DATASOURCES_DEFAULT_URL: "jdbc:postgresql://postgres:5432/catalyst"
  DATASOURCES_DEFAULT_USERNAME: "catalyst"
  DATASOURCES_DEFAULT_PASSWORD: "catalyst"
  DATASOURCES_DEFAULT_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  CATALYST_SERVER_PORT: "35556"
  CATALYST_SERVER_SESSION_TIMEOUT_SECONDS: "30"
  CATALYST_SERVER_AUTH_TICKET_TIMEOUT_SECONDS: "300"
  CATALYST_SERVER_KEEPALIVE_INTERVAL_MS: "5000"
  CATALYST_SERVER_ARGON2_ITERATIONS: "3"
  CATALYST_SERVER_ARGON2_MEMORY_KIB: "65536"
  CATALYST_SERVER_ARGON2_PARALLELISM: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: login-service
spec:
  ports:
    - port: 35556
      protocol: UDP
  selector:
    app: login-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
spec:
  selector:
    matchLabels:
      app: login-service
  template:
    metadata:
      labels:
        app: login-service
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: login-service
          image: catalyst-login-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 35556
              protocol: UDP
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: catalyst-config
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: login-tls-secret
---
