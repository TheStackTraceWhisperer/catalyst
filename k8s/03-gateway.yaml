apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer
  ports:
    - port: 35555
      targetPort: 35555
      protocol: UDP
  selector:
    app: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-management
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: gateway
          image: catalyst-catalyst-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 35555
              protocol: UDP
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 5
          env:
            - name: CATALYST_GATEWAY_BACKENDS_LOGIN_HOST
              value: "login-service"
            - name: CATALYST_GATEWAY_BACKENDS_LOGIN_PORT
              value: "35556"
            - name: CATALYST_GATEWAY_BACKENDS_LOGIN_POLICY
              value: "UNAUTHENTICATED"
            - name: CATALYST_GATEWAY_BACKENDS_LOBBY_HOST
              value: "lobby-service"
            - name: CATALYST_GATEWAY_BACKENDS_LOBBY_PORT
              value: "35556"
            - name: CATALYST_GATEWAY_BACKENDS_LOBBY_POLICY
              value: "AUTHENTICATED"
            - name: CATALYST_GATEWAY_BACKENDS_WORLD_HOST
              value: "world-service"
            - name: CATALYST_GATEWAY_BACKENDS_WORLD_PORT
              value: "35556"
            - name: CATALYST_GATEWAY_BACKENDS_WORLD_POLICY
              value: "SESSION_BOUND"
