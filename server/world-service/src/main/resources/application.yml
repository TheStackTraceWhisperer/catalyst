micronaut:
  banner:
    enabled: false

catalyst:
  server:
    port: 35563
    session-timeout-seconds: 30
    auth-ticket-timeout-seconds: 300
    argon2-iterations: 3
    argon2-memory-kib: 65536
    argon2-parallelism: 1
    keepalive-interval-ms: 5000
    db-url: jdbc:postgresql://localhost:5432/catalyst
    db-user: catalyst
    db-password: catalyst
    db-pool-max-size: 8
    db-pool-min-idle: 1
    db-connection-timeout-ms: 10000

datasources:
  default:
    url: ${catalyst.server.db-url:jdbc:postgresql://localhost:5432/catalyst}
    username: ${catalyst.server.db-user:catalyst}
    password: ${catalyst.server.db-password:catalyst}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: 8
    minimum-idle: 1
    connection-timeout: 10000
